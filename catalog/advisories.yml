# Registry of Directus advisories relevant to 9.26.0, 10.13.4, and 11.17.4.
# This is not a fork. Patches are optional, per-GHSA, and reversible.
# port.status:
#   already-fixed  — this Directus line already contains the fix
#   needs-port     — fixed only in 12.x; no backport in this catalog yet
#   experimental   — backport exists; applied on at least one install
#   stable         — backport applied in production without rollback
#   wont-port      — depends on a 12.x refactor; use config/WAF or upgrade

catalog_version: 1
updated: "2026-10-02"
notes: >
  Directus is not backporting 12.x security fixes onto 9 / 10 / 11. This catalog
  tracks what is still open on a given build and, when a backport exists, how risky
  it is to apply. Checksum pins are exact versions (9.26.0, 10.13.4, 11.17.4), not
  whole majors. Other builds need their own overlay. Studio loads on 10.13.4 and
  11.17.4 only; 9.26.0 is CLI-only.

advisories:
  - id: GHSA-97xr-jchp-xm3c
    title: Public WebSocket clients gain unrestricted item access after a failed auth message
    severity: critical
    advisory: https://github.com/directus/directus/security/advisories/GHSA-97xr-jchp-xm3c
    affects: "< 12.1.0"
    upstream_patched: "12.1.0"
    port:
      status: experimental
      risk: high
      notes: "Checksum-pinned to Directus 10.13.4 and 11.17.4. Failed or expired WebSocket auth now resets to public accountability instead of null (null is treated as system). Restart required."

  - id: GHSA-gwvv-rr68-cmv6
    title: Unauthenticated persistent DoS via prototype pollution in the deep query parameter
    severity: high
    advisory: https://github.com/directus/directus/security/advisories/GHSA-gwvv-rr68-cmv6
    affects: "< 12.2.0"
    upstream_patched: "12.2.0"
    port:
      status: experimental
      risk: high
      notes: "Checksum-pinned to Directus 9.26.0, 10.13.4, and 11.17.4. sanitizeDeep builds Object.create(null) so prototype pollution in `deep` cannot persist. Restart required."

  - id: GHSA-7vcx-mhxq-9j96
    title: DoS via image-transform endpoint accepting unvalidated target dimensions
    severity: high
    advisory: https://github.com/directus/directus/security/advisories/GHSA-7vcx-mhxq-9j96
    affects: "< 12.2.0"
    upstream_patched: "12.2.0"
    port:
      status: experimental
      risk: medium
      notes: Checksum-pinned to Directus 9.26.0, 10.13.4, and 11.17.4. Caps requested resize width/height at ASSETS_TRANSFORM_IMAGE_MAX_DIMENSION. Restart required.

  - id: GHSA-mww8-4gwh-rjfw
    title: Missing Origin validation on WebSocket upgrades (CSWSH)
    severity: high
    advisory: https://github.com/directus/directus/security/advisories/GHSA-mww8-4gwh-rjfw
    affects: ">= 10.10.5 < 12.1.0"
    upstream_patched: "12.1.0"
    port:
      status: experimental
      risk: medium
      notes: "Checksum-pinned to Directus 10.13.4 and 11.17.4. WebSocket upgrades require Origin to match Host, PUBLIC_URL, or CORS_ORIGIN. Restart required."

