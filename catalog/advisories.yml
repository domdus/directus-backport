# Registry of Directus advisories relevant to 9.26.0, 10.13.4, and 11.17.4.
# This is not a fork. Patches are optional, per-GHSA, and reversible.
# port.status:
#   already-fixed  — this Directus line already contains the fix
#   needs-port     — fixed only in 12.x; no backport in this catalog yet
#   experimental   — backport exists; not proven against this version
#   stable         — reproduced on the stock pin, blocked once patched, legitimate use unchanged
#   wont-port      — depends on a 12.x refactor; use config/WAF or upgrade
# port.pins optionally overrides the status per version: { "11.17.4": stable }

catalog_version: 1
updated: "2026-11-06"
notes: >
  Upstream Directus does not ship 12.x security fixes onto 9 / 10 / 11. This catalog
  is the optional stopgap: it tracks what is still open on a pinned build and, when a
  backport exists, how risky it is to apply. Checksum pins are exact versions
  (9.26.0, 10.13.4, 11.17.4), not whole majors. Other builds need their own overlay.
  Studio loads on 10.13.4 and 11.17.4 only; 9.26.0 is CLI-only.

advisories:
  - id: GHSA-32cw-mf7w-gpqr
    title: Authenticated persistent Denial of Service via prototype pollution in CSV import
    severity: high
    advisory: https://github.com/directus/directus/security/advisories/GHSA-32cw-mf7w-gpqr
    affects: "< 12.5.0"
    upstream_patched: "12.5.0"
    port:
      status: experimental
      risk: high
      pins: { "11.17.4": stable, "10.13.4": experimental, "9.26.0": stable }
      notes: "Checksum-pinned to Directus 9.26.0, 10.13.4, and 11.17.4. CSV import builds rows with a null-prototype setter that never follows inherited properties. Restart required."

  - id: GHSA-95f8-mvw7-gpj9
