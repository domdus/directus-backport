    port:
      status: experimental
      risk: high
      pins: { "11.17.4": stable, "10.13.4": stable, "9.26.0": experimental }
      notes: "filename_disk is rejected when it resolves inside EXTENSIONS_PATH or TEMP_PATH, compared as resolved paths, including TUS on 10.13.4 and 11.17.4. Restart required."

