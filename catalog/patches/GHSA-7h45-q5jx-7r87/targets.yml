- file: "@directus/api/dist/services/shares.js"
  before_sha256: 719256eddbb3cc19c4ea4378129552221c615f3a174211e7569ef3bfe7ae7d5b
  after_sha256: f8ddff04eb32780aaee3f719b575fdd5911da74e73408c565890c2eb5ed08a79
  replace:
    - from: import { ForbiddenError, InvalidCredentialsError } from "@directus/errors";
      to: import { ForbiddenError, InvalidCredentialsError, InvalidPayloadError } from "@directus/errors";
    - from: |-
        	async updateMany(keys, data, opts) {
        		await clearCache();
        		return super.updateMany(keys, data, opts);
        	}
      to: |-
        	async updateMany(keys, data, opts) {
        		if ("user_created" in data) throw new InvalidPayloadError({ reason: `You can't change the "user_created" value manually` });
        		if ("role" in data && this.accountability && this.accountability.admin !== true) throw new ForbiddenError();
        		if (this.accountability) await validateAccess({
        			collection: "directus_shares",
        			action: "update",
        			accountability: this.accountability,
        			primaryKeys: keys
        		}, {
        			knex: this.knex,
        			schema: this.schema
        		});
        		if (("item" in data || "collection" in data) && this.accountability) {
        			const rows = "item" in data && "collection" in data ? [data] : await this.knex.select("collection", "item").from("directus_shares").whereIn("id", keys);
        			for (const row of rows) await validateAccess({
        				accountability: this.accountability,
        				action: "share",
        				collection: data["collection"] ?? row["collection"],
        				primaryKeys: [data["item"] ?? row["item"]]
        			}, {
        				knex: this.knex,
        				schema: this.schema
        			});
        		}
        		await clearCache();
        		return super.updateMany(keys, data, opts);
        	}
