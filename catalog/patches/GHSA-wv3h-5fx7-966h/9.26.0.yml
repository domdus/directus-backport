      to: |-
        export const validateIP = async (ip, url) => {
            const mapped = String(ip).toLowerCase();
            if (mapped.startsWith('::ffff:'))
                ip = mapped.slice('::ffff:'.length).replace(/^([0-9a-f]{1,4}):([0-9a-f]{1,4})$/, (_, high, low) => { const a = parseInt(high, 16); const b = parseInt(low, 16); return [a >> 8, a & 255, b >> 8, b & 255].join('.'); });
            const env = getEnv();
