      to: "            logger.warn(`Couldn't find operation ${operation.type}`);\n            return { successor: null, status: 'unknown', data: null, options: null };\n        }\n        if (operation.type === 'log') {\n            const redactLogRequest = (value, parent) => {\n                if (Array.isArray(value))\n                    return value.map((entry) => redactLogRequest(entry, parent));\n                if (value === null || typeof value !== 'object' || value instanceof Date)\n                    return value;\n                const output = {};\n                for (const [key, entry] of Object.entries(value)) {\n                    output[key] = ({'headers':['authorization','cookie'],'query':['access_token']}[parent] ?? []).includes(key) ? '--redacted--' : redactLogRequest(entry, key);\n                }\n                return output;\n            };\n            keyedData = redactLogRequest(keyedData, null);\n        }"
