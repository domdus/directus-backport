      to: "const env = useEnv();\nconst logger = useLogger();\nfunction setDeepSafe(root, path, value) {\n    const segments = String(path).split('.');\n    if (!segments.length || segments.some((s) => s.length === 0)) return root;\n    const assignOwn = (obj, key, val) => {\n        Object.defineProperty(obj, key, { value: val, writable: true, enumerable: true, configurable: true });\n    };\n    let node = root;\n    for (let i = 0; i < segments.length - 1; i++) {\n        const key = segments[i];\n        if (!Object.prototype.hasOwnProperty.call(node, key) || typeof node[key] !== 'object' || node[key] === null) assignOwn(node, key, Object.create(null));\n        node = node[key];\n    }\n    assignOwn(node, segments[segments.length - 1], value);\n    return root;\n}\nexport class ImportService {"
    - from: "                        for (const field in obj) {\n                            if (obj[field] === undefined) {\n                                delete obj[field];\n                            }\n                        }\n                        saveQueue.push(obj);"
      to: "                        const result = Object.create(null);\n                        for (const field in obj) {\n                            if (obj[field] !== undefined) {\n                                setDeepSafe(result, field, obj[field]);\n                            }\n                        }\n                        saveQueue.push(result);"
