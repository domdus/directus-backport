    - from: "export async function applySearch(knex, schema, dbQuery, searchQuery, collection) {\n    const { number: numberHelper } = getHelpers(knex);\n    const fields = Object.entries(schema.collections[collection].fields);"
      to: "export async function applySearch(knex, schema, dbQuery, searchQuery, collection, allowedFields) {\n    const { number: numberHelper } = getHelpers(knex);\n    let fields = Object.entries(schema.collections[collection].fields);\n    if (allowedFields !== undefined) {\n        const allowed = allowedFields === null ? [] : typeof allowedFields === 'string' ? allowedFields.split(',') : allowedFields;\n        if (!allowed.includes('*'))\n            fields = fields.filter(([name]) => allowed.includes(name));\n    }"
