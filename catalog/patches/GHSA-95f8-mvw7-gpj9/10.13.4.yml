            const inside = (base) => { const root = path.resolve(String(base)); return resolvedPath === root || resolvedPath.startsWith(root + path.sep); };
            if (driver === 'local' && (inside(env['EXTENSIONS_PATH'] ?? './extensions') || inside(env['TEMP_PATH'] ?? './temp'))) throw new ForbiddenError();
            const blocked = (base) => base && (filePath === base || filePath.startsWith(base + '/'));
            if (env['EXTENSIONS_LOCATION'] && env['EXTENSIONS_LOCATION'] === location && blocked(extensionPath)) throw new ForbiddenError();
            if (driver === 'local') {
                const tmpPath = sanitize(env['TEMP_PATH'] ?? './temp');
