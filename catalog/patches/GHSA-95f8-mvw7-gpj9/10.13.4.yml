- file: "@directus/api/dist/services/files.js"
  before_sha256: "dd2ac5e1701d268d41fc28f33a57842585fa641504fc637002b93d220e26123e"
  after_sha256: "48ab5b2119b4dc9665e46e17482ce69982aad9d28ea596952288df2cb0cf9117"
  replace:
    - from: "const env = useEnv();\nconst logger = useLogger();\nexport class FilesService extends ItemsService {"
      to: "const env = useEnv();\nconst logger = useLogger();\nfunction assertValidStoragePath(filepath, storage) {\n    if (!filepath) return;\n    const location = storage || toArray(env['STORAGE_LOCATIONS'])[0];\n    if (!location) return;\n    const loc = String(location).toUpperCase();\n    const driver = env['STORAGE_' + loc + '_DRIVER'];\n    const storageRoot = env['STORAGE_' + loc + '_ROOT'] ?? '';\n    const sanitize = (p) => path.relative(path.sep, path.resolve(path.sep, String(p ?? ''))).split(path.sep).join('/');\n    const normalizedFilePath = sanitize(filepath);\n    const filePath = driver === 'local' ? sanitize(path.join(String(storageRoot), normalizedFilePath)) : normalizedFilePath;\n    const extensionPath = sanitize(env['EXTENSIONS_PATH'] ?? './extensions');\n    const blocked = (base) => base && (filePath === base || filePath.startsWith(base + '/'));\n    if (env['EXTENSIONS_LOCATION'] && env['EXTENSIONS_LOCATION'] === location && blocked(extensionPath)) throw new ForbiddenError();\n    if (driver === 'local') {\n        const tmpPath = sanitize(env['TEMP_PATH'] ?? './temp');\n        if (blocked(extensionPath) || blocked(tmpPath)) throw new ForbiddenError();\n    }\n}\nexport class FilesService extends ItemsService {"
    - from: "        if (!data.type) {\n            throw new InvalidPayloadError({ reason: `\"type\" is required` });\n        }\n        const key = await super.createOne(data, opts);"
      to: "        if (!data.type) {\n            throw new InvalidPayloadError({ reason: `\"type\" is required` });\n        }\n        assertValidStoragePath(data.filename_disk, data.storage);\n        const key = await super.createOne(data, opts);"
    - from: "        payload.filename_disk ||= primaryKey + (fileExtension || '');"
      to: "        payload.filename_disk ||= primaryKey + (fileExtension || '');\n        assertValidStoragePath(payload.filename_disk, payload.storage);"
