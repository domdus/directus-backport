            const loc = String(location).toUpperCase();
            const driver = env['STORAGE_' + loc + '_DRIVER'];
            const storageRoot = env['STORAGE_' + loc + '_ROOT'] ?? '';
            const sanitize = (p) => path.relative(path.sep, path.resolve(path.sep, String(p ?? ''))).split(path.sep).join('/');
            const normalizedFilePath = sanitize(filepath);
            const filePath = driver === 'local' ? sanitize(path.join(String(storageRoot), normalizedFilePath)) : normalizedFilePath;
            const extensionPath = sanitize(env['EXTENSIONS_PATH'] ?? './extensions');
