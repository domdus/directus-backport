      to: "const env = useEnv();\nconst logger = useLogger();\nfunction assertValidStoragePath(filepath, storage) {\n\tif (!filepath) return;\n\tconst location = storage || toArray(env[\"STORAGE_LOCATIONS\"])[0];\n\tif (!location) return;\n\tconst loc = String(location).toUpperCase();\n\tconst driver = env[\"STORAGE_\" + loc + \"_DRIVER\"];\n\tconst storageRoot = env[\"STORAGE_\" + loc + \"_ROOT\"] ?? \"\";\n\tconst sanitize = (p) => path.relative(path.sep, path.resolve(path.sep, String(p ?? \"\"))).split(path.sep).join(\"/\");\n\tconst normalizedFilePath = sanitize(filepath);\n\tconst filePath = driver === \"local\" ? sanitize(path.join(String(storageRoot), normalizedFilePath)) : normalizedFilePath;\n\tconst extensionPath = sanitize(env[\"EXTENSIONS_PATH\"] ?? \"./extensions\");\n\tconst blocked = (base) => base && (filePath === base || filePath.startsWith(base + \"/\"));\n\tif (env[\"EXTENSIONS_LOCATION\"] && env[\"EXTENSIONS_LOCATION\"] === location && blocked(extensionPath)) throw new ForbiddenError();\n\tif (driver === \"local\") {\n\t\tconst tmpPath = sanitize(env[\"TEMP_PATH\"] ?? \"./temp\");\n\t\tif (blocked(extensionPath) || blocked(tmpPath)) throw new ForbiddenError();\n\t}\n}\nvar FilesService = class FilesService extends ItemsService {"
