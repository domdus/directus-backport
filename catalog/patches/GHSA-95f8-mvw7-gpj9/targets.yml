        import path, { extname } from "node:path";
        import { useEnv } from "@directus/env";
        import { toArray } from "@directus/utils";
    - from: var TusDataStore = class extends DataStore {
      to: |-
        const env = useEnv();
        function assertValidStoragePath(filepath, storage) {
        	if (!filepath) return;
        	const location = storage || toArray(env["STORAGE_LOCATIONS"])[0];
        	if (!location) return;
        	const loc = String(location).toUpperCase();
        	const driver = env["STORAGE_" + loc + "_DRIVER"];
        	const storageRoot = env["STORAGE_" + loc + "_ROOT"] ?? "";
        	const sanitize = (p) => path.relative(path.sep, path.resolve(path.sep, String(p ?? ""))).split(path.sep).join("/");
        	const normalizedFilePath = sanitize(filepath);
        	const filePath = driver === "local" ? sanitize(path.join(String(storageRoot), normalizedFilePath)) : normalizedFilePath;
        	const extensionPath = sanitize(env["EXTENSIONS_PATH"] ?? "./extensions");
        	const resolvedPath = path.resolve(String(storageRoot || "."), normalizedFilePath);
            const inside = (base) => { const root = path.resolve(String(base)); return resolvedPath === root || resolvedPath.startsWith(root + path.sep); };
            if (driver === "local" && (inside(env["EXTENSIONS_PATH"] ?? "./extensions") || inside(env["TEMP_PATH"] ?? "./temp"))) throw ERRORS.INVALID_METADATA;
            const blocked = (base) => base && (filePath === base || filePath.startsWith(base + "/"));
        	if (env["EXTENSIONS_LOCATION"] && env["EXTENSIONS_LOCATION"] === location && blocked(extensionPath)) throw ERRORS.INVALID_METADATA;
        	if (driver === "local") {
        		const tmpPath = sanitize(env["TEMP_PATH"] ?? "./temp");
        		if (blocked(extensionPath) || blocked(tmpPath)) throw ERRORS.INVALID_METADATA;
        	}
        }
        var TusDataStore = class extends DataStore {
    - from: '		fileData.filename_disk ||= primaryKey + (fileExtension || "");'
      to: |-
        		fileData.filename_disk ||= primaryKey + (fileExtension || "");
