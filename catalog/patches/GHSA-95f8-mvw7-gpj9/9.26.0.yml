      to: "import { ItemsService } from './items.js';\nfunction assertValidStoragePath(filepath, storage) {\n    if (!filepath) return;\n    const location = storage || toArray(env['STORAGE_LOCATIONS'])[0];\n    if (!location) return;\n    const loc = String(location).toUpperCase();\n    const driver = env['STORAGE_' + loc + '_DRIVER'];\n    const storageRoot = env['STORAGE_' + loc + '_ROOT'] ?? '';\n    const sanitize = (p) => path.relative(path.sep, path.resolve(path.sep, String(p ?? ''))).split(path.sep).join('/');\n    const normalizedFilePath = sanitize(filepath);\n    const filePath = driver === 'local' ? sanitize(path.join(String(storageRoot), normalizedFilePath)) : normalizedFilePath;\n    const extensionPath = sanitize(env['EXTENSIONS_PATH'] ?? './extensions');\n    const blocked = (base) => base && (filePath === base || filePath.startsWith(base + '/'));\n    if (env['EXTENSIONS_LOCATION'] && env['EXTENSIONS_LOCATION'] === location && blocked(extensionPath)) throw new ForbiddenException();\n    if (driver === 'local') {\n        const tmpPath = sanitize(env['TEMP_PATH'] ?? './temp');\n        if (blocked(extensionPath) || blocked(tmpPath)) throw new ForbiddenException();\n    }\n}\nexport class FilesService extends ItemsService {"
